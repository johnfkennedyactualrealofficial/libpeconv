name: Build x32 DLL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake for x32 (Win32)
      run: |
        cmake -A Win32 -DBUILD_SHARED_LIBS=ON -B build

    - name: Build Library (Release)
      run: |
        cmake --build build --config Release

    - name: Upload All Built DLLs and Libs
      uses: actions/upload-artifact@v4
      with:
        name: libpeconv-x32-all-dlls
        path: |
          build/**/*.dll
          build/**/*.lib
